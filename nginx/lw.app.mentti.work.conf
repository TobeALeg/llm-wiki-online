server {
    listen 80;
    server_name lw.app.mentti.work;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lw.app.mentti.work;

    ssl_certificate /etc/letsencrypt/live/lw.app.mentti.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lw.app.mentti.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /mcp {
        proxy_pass http://127.0.0.1:4310/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
