name: Deploy LLM Wiki

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./plugins/llm-wiki
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: verify
    if: ${{ secrets.LW_DEPLOY_HOST != '' && secrets.LW_DEPLOY_SSH_KEY != '' && secrets.LW_DEPLOY_KNOWN_HOSTS != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source and restart services
        env:
          DEPLOY_HOST: ${{ secrets.LW_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LW_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.LW_DEPLOY_PATH }}
          DEPLOY_KEY: ${{ secrets.LW_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.LW_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null deploy-key
          printf '%s\n' "$DEPLOY_KEY" > deploy-key
          install -m 600 /dev/null known_hosts
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > known_hosts
          tar --exclude=.git --exclude=.env.production -czf llm-wiki.tar.gz .
          scp -i deploy-key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes llm-wiki.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/llm-wiki.tar.gz"
          ssh -i deploy-key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar -xzf /tmp/llm-wiki.tar.gz -C '$DEPLOY_PATH' && cd '$DEPLOY_PATH' && docker compose -f docker-compose.production.yml up -d --build"
