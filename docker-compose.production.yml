services:
  web:
    build: .
    command: ["llm-wiki-web", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env.production
    environment:
      LLM_WIKI_DATABASE: /var/lib/llm-wiki/lw.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - lw-data:/var/lib/llm-wiki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    build: .
    command: ["llm-wiki-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "4310"]
    env_file: .env.production
    environment:
      LLM_WIKI_REMOTE: "true"
      LLM_WIKI_DATABASE: /var/lib/llm-wiki/lw.sqlite3
    ports:
      - "127.0.0.1:4310:4310"
    volumes:
      - lw-data:/var/lib/llm-wiki
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; processor=type('NoErrorProcessor',(urllib.request.HTTPErrorProcessor,),{'http_response':lambda self,request,response: response,'https_response':lambda self,request,response: response}); opener=urllib.request.build_opener(processor); response=opener.open(urllib.request.Request('http://127.0.0.1:4310/mcp',method='GET'),timeout=3); raise SystemExit(0 if response.status in (200,401,405) else 1)"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lw-data:
